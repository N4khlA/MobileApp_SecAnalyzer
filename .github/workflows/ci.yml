name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: lint
        run: ruff check .
      - name: test
        run: pytest --cov=masa --cov-report=term-missing

  package:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: build
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: install wheel
        run: |
          python -m venv /tmp/masa-venv
          /tmp/masa-venv/bin/pip install dist/*.whl
          /tmp/masa-venv/bin/masa --version
          /tmp/masa-venv/bin/masa rules > /dev/null

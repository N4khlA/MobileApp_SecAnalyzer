[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "masa"
version = "1.1.0"
description = "Mobile App Security Analyzer - static security assessment of Android APKs and iOS IPAs with OWASP Mobile Top 10 compliance reporting"
readme = "README.md"
authors = [
    { name = "Guerfi Ahmed Yacine", email = "ay.guerfi@esi-sba.dz" }
]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
keywords = ["mobile", "security", "android", "ios", "apk", "ipa", "owasp", "static-analysis", "sast"]
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
masa = "masa.cli:main"

[project.urls]
Homepage = "https://github.com/N4khlA/MobileApp_SecAnalyzer"
Documentation = "https://github.com/N4khlA/MobileApp_SecAnalyzer#readme"
Changelog = "https://github.com/N4khlA/MobileApp_SecAnalyzer/blob/main/CHANGELOG.md"
Issues = "https://github.com/N4khlA/MobileApp_SecAnalyzer/issues"

[tool.setuptools]
packages = ["masa"]

[tool.ruff]
target-version = "py39"
line-length = 100
extend-exclude = ["samples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "I001"]
"masa/rules.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["masa"]
